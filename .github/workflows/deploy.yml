name: Deploy

# master is what farukoruc.com serves. A second push while the first is still
# deploying would race for the same worker; the newer commit is the one worth having.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # packageManager pins yarn 4; corepack is what makes the runner use it.
      - run: corepack enable

      # --immutable fails if yarn.lock does not already satisfy package.json.
      - run: yarn install --immutable

      # `yarn deploy` is next build + export-tags + wrangler deploy.
      - run: yarn deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
